<!DOCTYPE html>
<html>
<head>
<title>ReferPro Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Arial;
background:#f3f6fb;
margin:0;
}
header{
background:#111827;
color:white;
padding:20px;
text-align:center;
font-size:25px;
}
.container{
padding:20px;
}
.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 5px 15px #0002;
}
button{
padding:8px 12px;
border:0;
border-radius:6px;
background:#16a34a;
color:white;
cursor:pointer;
}
.reject{
background:#dc2626;
}
table{
width:100%;
border-collapse:collapse;
}
td,th{
padding:10px;
border-bottom:1px solid #ddd;
}
</style>

</head>

<body>

<header>
ReferPro Admin Panel
</header>


<div class="container">


<div class="card">
<h2>Stats</h2>

<p>Total Users:
<b id="users">0</b>
</p>

<p>Pending Deposits:
<b id="depCount">0</b>
</p>

<p>Pending Withdrawals:
<b id="withCount">0</b>
</p>

</div>



<div class="card">

<h2>Deposits</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="deposits">
</tbody>

</table>

</div>



<div class="card">

<h2>Withdrawals</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="withdrawals">
</tbody>

</table>

</div>


</div>



<script type="module">


import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getDatabase,
ref,
get,
update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig={

apiKey:"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

authDomain:"referpro-65d27.firebaseapp.com",

databaseURL:"https://referpro-65d27-default-rtdb.firebaseio.com",

projectId:"referpro-65d27",

storageBucket:"referpro-65d27.firebasestorage.app",

messagingSenderId:"257409426857",

appId:"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);



onAuthStateChanged(auth,async user=>{


if(!user){

location="login.html";

return;

}


let admin=await get(ref(db,"admins/"+user.uid));


if(admin.val()!=true){

alert("Not Admin");

location="dashboard.html";

return;

}


loadUsers();

loadDeposits();

loadWithdrawals();


});





async function loadUsers(){

let s=await get(ref(db,"users"));

let users=s.val()||{};


document.getElementById("users").innerText=
Object.keys(users).length;

}







async function loadDeposits(){

let s=await get(ref(db,"deposits"));

let data=s.val()||{};

let html="";

let count=0;


for(let id in data){

let d=data[id];


if(d.status=="pending")
count++;


html+=`

<tr>

<td>${d.name}</td>

<td>${d.amount}</td>

<td>${d.status}</td>

<td>

<button onclick="approveDeposit('${id}')">
Approve
</button>


<button class="reject"
onclick="rejectDeposit('${id}')">
Reject
</button>

</td>

</tr>

`;

}


document.getElementById("depCount").innerText=count;

document.getElementById("deposits").innerHTML=html;


}







window.approveDeposit=async id=>{

await update(ref(db,"deposits/"+id),{

status:"approved"

});

loadDeposits();

}





window.rejectDeposit=async id=>{

await update(ref(db,"deposits/"+id),{

status:"rejected"

});

loadDeposits();

}






async function loadWithdrawals(){

let s=await get(ref(db,"withdrawals"));

let data=s.val()||{};

let html="";

let count=0;



for(let id in data){

let w=data[id];


if(w.status=="pending")
count++;


html+=`

<tr>

<td>${w.name}</td>

<td>${w.amount}</td>

<td>${w.status}</td>

<td>


<button onclick="approveWithdraw('${id}')">
Approve
</button>


<button class="reject"
onclick="rejectWithdraw('${id}')">
Reject
</button>


</td>

</tr>

`;

}


document.getElementById("withCount").innerText=count;

document.getElementById("withdrawals").innerHTML=html;


}





window.approveWithdraw=async id=>{

await update(ref(db,"withdrawals/"+id),{

status:"approved"

});

loadWithdrawals();

}




window.rejectWithdraw=async id=>{


await update(ref(db,"withdrawals/"+id),{

status:"rejected"

});


loadWithdrawals();


}



</script>


</body>
</html>
