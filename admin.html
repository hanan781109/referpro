<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Admin Panel</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px #0002;
    margin-bottom:20px;
}

h2{
    color:#2563eb;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.number{
    font-size:32px;
    font-weight:bold;
    color:#16a34a;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

button{
    padding:10px 15px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

.approve{
    background:#16a34a;
}

.reject{
    background:#dc2626;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

.login{
    max-width:400px;
    margin:40px auto;
}

.hidden{
    display:none;
}

</style>

</head>

<body>


<header>
ReferPro Admin Panel
</header>


<div class="container">


<div class="card login" id="loginBox">

<h2>Admin Login</h2>

<input id="adminEmail" placeholder="Admin Email">

<input id="adminPass" type="password" placeholder="Password">

<button onclick="adminLogin()">
Login
</button>

<p id="msg"></p>

</div>



<div id="panel" class="hidden">


<div class="grid">


<div class="card">

<h2>Total Users</h2>

<div class="number">
0
</div>

</div>



<div class="card">

<h2>Deposit Requests</h2>

<div class="number">
0
</div>

</div>



<div class="card">

<h2>Withdraw Requests</h2>

<div class="number">
0
</div>

</div>



<div class="card">

<h2>Active Accounts</h2>

<div class="number">
0
</div>

</div>


</div>



<div class="card">

<h2>Deposit Verification</h2>


<table>

<tr>
<th>User</th>
<th>Amount</th>
<th>TRX ID</th>
<th>Action</th>
</tr>


<tr>

<td>No Requests</td>

<td>Rs.500</td>

<td>---</td>

<td>

<button class="approve">
Approve
</button>

<button class="reject">
Reject
</button>

</td>

</tr>


</table>

</div>




<div class="card">

<h2>Withdrawal Requests</h2>


<table>

<tr>
<th>User</th>
<th>Amount</th>
<th>Method</th>
<th>Action</th>
</tr>


<tr>

<td>No Requests</td>

<td>---</td>

<td>Easypaisa</td>

<td>

<button class="approve">
Approve
</button>

<button class="reject">
Reject
</button>

</td>

</tr>


</table>


</div>


</div>


</div>




<script>

function adminLogin(){

let email=document.getElementById("adminEmail").value;
let pass=document.getElementById("adminPass").value;


if(email && pass){

document.getElementById("loginBox").style.display="none";

document.getElementById("panel").classList.remove("hidden");

}
else{

document.getElementById("msg").innerText=
"Enter admin details";

}

}

</script>


</body>
</html>
