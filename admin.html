<!DOCTYPE html>
<html>
<head>

<title>ReferPro Admin</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:Arial;
background:#f3f6fb;
margin:0;
}

header{
background:#111827;
color:white;
padding:20px;
text-align:center;
font-size:25px;
}

.box{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px #0002;
}

button{
padding:8px 12px;
border:0;
border-radius:7px;
background:green;
color:white;
cursor:pointer;
margin:3px;
}

.red{
background:red;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>


<header>
ReferPro Admin Panel
</header>


<div class="box">

<button id="logout">
Logout
</button>

</div>


<div class="box">

<h2>Deposits</h2>

<table>

<tbody id="depositList"></tbody>

</table>

</div>



<div class="box">

<h2>Withdrawals</h2>

<table>

<tbody id="withdrawList"></tbody>

</table>

</div>




<script type="module">


import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getDatabase,
ref,
get,
update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig={

apiKey:"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

authDomain:"referpro-65d27.firebaseapp.com",

databaseURL:"https://referpro-65d27-default-rtdb.firebaseio.com",

projectId:"referpro-65d27",

storageBucket:"referpro-65d27.firebasestorage.app",

messagingSenderId:"257409426857",

appId:"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);


const adminEmail="hananjanweribro@gmail.com";



onAuthStateChanged(auth,(user)=>{


if(!user){

location="login.html";
return;

}


if(user.email!==adminEmail){

alert("You are not admin");

location="user-login.html";

return;

}


loadDeposits();

loadWithdrawals();


});





logout.onclick=()=>{

signOut(auth);

location="login.html";

};






async function loadDeposits(){


let data=(await get(ref(db,"deposits"))).val()||{};


let html="";


for(let id in data){

let d=data[id];


html+=`

<tr>

<td>${d.name}</td>

<td>Rs ${d.amount}</td>

<td>${d.status}</td>

<td>

<button onclick="approveDeposit('${id}')">
Approve
</button>


<button class="red" onclick="rejectDeposit('${id}')">
Reject
</button>

</td>

</tr>

`;

}


depositList.innerHTML=html;


}





window.approveDeposit=async(id)=>{


let d=(await get(ref(db,"deposits/"+id))).val();


await update(ref(db,"deposits/"+id),{

status:"approved"

});


let u=(await get(ref(db,"users/"+d.uid))).val()||{};



await update(ref(db,"users/"+d.uid),{

wallet:Number(u.wallet||0)+50

});


alert("Deposit Approved +50");

loadDeposits();


};






window.rejectDeposit=async(id)=>{


await update(ref(db,"deposits/"+id),{

status:"rejected"

});


loadDeposits();

};







async function loadWithdrawals(){


let data=(await get(ref(db,"withdrawals"))).val()||{};


let html="";


for(let id in data){


let w=data[id];


html+=`

<tr>

<td>${w.name}</td>

<td>Rs ${w.amount}</td>

<td>${w.status}</td>


<td>

<button onclick="approveWithdraw('${id}')">
Approve
</button>


<button class="red" onclick="rejectWithdraw('${id}')">
Reject
</button>


</td>


</tr>

`;

}


withdrawList.innerHTML=html;


}






window.approveWithdraw=async(id)=>{


let w=(await get(ref(db,"withdrawals/"+id))).val();


let u=(await get(ref(db,"users/"+w.uid))).val()||{};


let wallet=Number(u.wallet||0);


let amount=Number(w.amount||0);


if(wallet<amount){

alert("Low wallet");

return;

}


await update(ref(db,"users/"+w.uid),{

wallet:wallet-amount

});


await update(ref(db,"withdrawals/"+id),{

status:"approved"

});


alert("Withdrawal Approved");

loadWithdrawals();


};






window.rejectWithdraw=async(id)=>{


await update(ref(db,"withdrawals/"+id),{

status:"rejected"

});


loadWithdrawals();


};


</script>


</body>
</html>
