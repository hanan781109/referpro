<!DOCTYPE html>
<html>
<head>

<title>ReferPro Admin Panel</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:Arial;
background:#f3f6fb;
margin:0;
}

header{
background:#111827;
color:white;
padding:20px;
text-align:center;
font-size:25px;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px #0002;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

button{
padding:8px 12px;
border:0;
border-radius:6px;
background:#16a34a;
color:white;
cursor:pointer;
}

.reject{
background:#dc2626;
}

</style>

</head>


<body>


<header>
ReferPro Admin Panel
</header>


<div class="card">

<h2>Deposits</h2>

<table>

<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>

<tbody id="deposits"></tbody>

</table>

</div>




<div class="card">

<h2>Withdrawals</h2>

<table>

<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>

<tbody id="withdrawals"></tbody>

</table>

</div>



<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,
ref,
get,
update

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




const firebaseConfig={


apiKey:"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

authDomain:"referpro-65d27.firebaseapp.com",

databaseURL:"https://referpro-65d27-default-rtdb.firebaseio.com",

projectId:"referpro-65d27",

storageBucket:"referpro-65d27.firebasestorage.app",

messagingSenderId:"257409426857",

appId:"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);





onAuthStateChanged(auth,async(user)=>{


if(!user){

location="login.html";

return;

}



let admin =
await get(ref(db,"admins/"+user.uid));



if(admin.val()!=true){

alert("Not Admin");

location="user-login.html";

return;

}



loadDeposits();

loadWithdrawals();


});






async function loadDeposits(){


let data=(await get(ref(db,"deposits"))).val()||{};


let html="";


for(let id in data){


let d=data[id];


html+=`

<tr>

<td>${d.name}</td>

<td>${d.amount}</td>

<td>${d.status}</td>


<td>


<button onclick="approveDeposit('${id}')">
Approve
</button>


<button class="reject" onclick="rejectDeposit('${id}')">
Reject
</button>


</td>


</tr>


`;

}


document.getElementById("deposits").innerHTML=html;


}






window.approveDeposit=async(id)=>{


let dep=(await get(ref(db,"deposits/"+id))).val();


await update(ref(db,"deposits/"+id),{

status:"approved"

});



let user=(await get(ref(db,"users/"+dep.uid))).val()||{};



if(user.depositBonusGiven!=true){


await update(ref(db,"users/"+dep.uid),{

wallet:Number(user.wallet||0)+50,

depositBonusGiven:true

});


}



alert("Deposit Approved +50");

loadDeposits();


}






window.rejectDeposit=async(id)=>{


await update(ref(db,"deposits/"+id),{

status:"rejected"

});


loadDeposits();


}






async function loadWithdrawals(){


let data=(await get(ref(db,"withdrawals"))).val()||{};


let html="";


for(let id in data){


let w=data[id];


html+=`

<tr>

<td>${w.name}</td>

<td>${w.amount}</td>

<td>${w.status}</td>


<td>


<button onclick="approveWithdraw('${id}')">
Approve
</button>


<button class="reject" onclick="rejectWithdraw('${id}')">
Reject
</button>


</td>

</tr>

`;

}



document.getElementById("withdrawals").innerHTML=html;


}






window.approveWithdraw=async(id)=>{


let w=(await get(ref(db,"withdrawals/"+id))).val();


let user=(await get(ref(db,"users/"+w.uid))).val()||{};


let wallet=Number(user.wallet||0);


let amount=Number(w.amount||0);



if(wallet < amount){

alert("Low Wallet Balance");

return;

}



await update(ref(db,"users/"+w.uid),{

wallet:wallet-amount

});



await update(ref(db,"withdrawals/"+id),{

status:"approved"

});


alert("Withdrawal Approved");


loadWithdrawals();


}






window.rejectWithdraw=async(id)=>{


await update(ref(db,"withdrawals/"+id),{

status:"rejected"

});


loadWithdrawals();


}



</script>


</body>
</html>
