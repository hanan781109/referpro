<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px #0002;
    margin-bottom:20px;
}

h2{
    color:#2563eb;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    background:#f8fafc;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:30px;
    color:#2563eb;
    margin-top:8px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

button{
    padding:10px 18px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.logout{
    background:#dc2626;
}

.message{
    padding:15px;
    border-radius:8px;
    background:#fee2e2;
    color:#991b1b;
    display:none;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    table{
        font-size:13px;
    }
}
</style>
</head>

<body>

<header>
ReferPro Admin Panel
</header>

<div class="container">

<div id="message" class="message"></div>

<div class="card">
<h2>Admin Dashboard</h2>

<div class="stats">

<div class="stat">
Total Users
<b id="totalUsers">0</b>
</div>

<div class="stat">
Active Users
<b id="activeUsers">0</b>
</div>

<div class="stat">
Admins
<b id="totalAdmins">0</b>
</div>

</div>

</div>

<div class="card">

<h2>Users</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Referral Code</th>
</tr>
</thead>

<tbody id="usersTable">
</tbody>

</table>

</div>

<div class="card">

<button class="logout" id="logoutBtn">
Logout
</button>

</div>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

authDomain: "referpro-65d27.firebaseapp.com",

projectId: "referpro-65d27",

storageBucket: "referpro-65d27.firebasestorage.app",

messagingSenderId: "257409426857",

appId: "1:257409426857:web:8cfcdf79eab219d6f890b8",

measurementId: "G-GFC4WMB2HN"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


const message = document.getElementById("message");


function showMessage(text){

message.innerText = text;

message.style.display = "block";

}


onAuthStateChanged(auth, async (user)=>{

if(!user){

window.location = "login.html";

return;

}


try{

const adminSnapshot =
await get(ref(db,"admins/"+user.uid));


if(adminSnapshot.val() !== true){

showMessage("Access Denied: You are not an admin.");

setTimeout(()=>{

window.location = "dashboard.html";

},2000);

return;

}


loadUsers();

}
catch(error){

console.error(error);

showMessage("Admin verification failed.");

}

});


async function loadUsers(){

try{

const snapshot =
await get(ref(db,"users"));

const users =
snapshot.val() || {};

const table =
document.getElementById("usersTable");

table.innerHTML = "";

let total = 0;

for(const uid in users){

const user = users[uid];

total++;

const row = document.createElement("tr");

row.innerHTML = `

<td>${user.name || "-"}</td>

<td>${user.email || "-"}</td>

<td>${user.phone || "-"}</td>

<td>${user.referralCode || "-"}</td>

`;

table.appendChild(row);

}


document.getElementById("totalUsers").innerText = total;

document.getElementById("activeUsers").innerText = total;


const adminsSnapshot =
await get(ref(db,"admins"));

const admins =
adminsSnapshot.val() || {};

document.getElementById("totalAdmins").innerText =
Object.keys(admins).length;

}
catch(error){

console.error(error);

showMessage("Users load nahi ho rahe: " + error.message);

}

}


document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await signOut(auth);

window.location = "login.html";

});

</script>

</body>
</html>
