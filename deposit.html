<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Deposit</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

.payment{
    background:#eaffea;
    border-left:5px solid #16a34a;
    padding:20px;
    border-radius:10px;
    margin:20px 0;
}

.amount{
    font-size:35px;
    font-weight:bold;
    color:#16a34a;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#16a34a;
}

a{
    text-decoration:none;
    color:#2563eb;
}

.footer{
    text-align:center;
    margin-top:20px;
}

</style>

</head>


<body>


<header>
ReferPro Deposit
</header>



<div class="container">


<h2>Deposit Payment</h2>


<div class="payment">

<p>Package Amount</p>

<div class="amount">
Rs. 500
</div>


<p>
Payment Method:
<b>Easypaisa</b>
</p>


<p>
Account Number:
<br>
<b>03263210958</b>
</p>


</div>



<h3>Submit Payment Details</h3>


<label>Your Name</label>

<input type="text" placeholder="Enter name">



<label>Easypaisa Sender Number</label>

<input type="number" placeholder="03XXXXXXXXX">



<label>Transaction ID / TRX ID</label>

<input type="text" placeholder="Enter transaction ID">



<button>
Submit Deposit Request
</button>



<div class="footer">

<p>
<a href="dashboard.html">
Back To Dashboard
</a>
</p>

</div>


</div>



</body>
</html>
