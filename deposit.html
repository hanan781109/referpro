<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Deposit</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

.payment{
    background:#eaffea;
    border-left:5px solid #16a34a;
    padding:20px;
    border-radius:10px;
    margin:20px 0;
}

.amount{
    font-size:35px;
    font-weight:bold;
    color:#16a34a;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#16a34a;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>


<body>


<header>
ReferPro Deposit
</header>



<div class="container">


<h2>Deposit Payment</h2>


<div class="payment">

<p>Package Amount</p>

<div class="amount">
Rs. 500
</div>


<p>
Payment Method:
<b>Easypaisa</b>
</p>


<p>
Account Number:
<br>
<b>03263210958</b>
</p>

</div>



<h3>Submit Payment Details</h3>


<label>Your Name</label>

<input 
type="text"
id="name"
placeholder="Enter name"
required>



<label>Easypaisa Sender Number</label>

<input 
type="number"
id="senderNumber"
placeholder="03XXXXXXXXX"
required>



<label>Transaction ID / TRX ID</label>

<input 
type="text"
id="trxId"
placeholder="Enter transaction ID"
required>



<button id="submitDeposit">
Submit Deposit Request
</button>


<div id="message"></div>



</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,

onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,

ref,

push,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {


apiKey:
"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",


authDomain:
"referpro-65d27.firebaseapp.com",


databaseURL:
"https://referpro-65d27-default-rtdb.firebaseio.com",


projectId:
"referpro-65d27",


storageBucket:
"referpro-65d27.firebasestorage.app",


messagingSenderId:
"257409426857",


appId:
"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getDatabase(app);



let currentUser = null;



onAuthStateChanged(auth,(user)=>{


if(!user){

window.location.href="login.html";

return;

}


currentUser = user;


});




document
.getElementById("submitDeposit")
.addEventListener("click", async()=>{


if(!currentUser){

alert("Please login first");

return;

}



const name =
document.getElementById("name").value.trim();



const senderNumber =
document.getElementById("senderNumber").value.trim();



const trxId =
document.getElementById("trxId").value.trim();



if(!name || !senderNumber || !trxId){


document.getElementById("message").style.color="red";

document.getElementById("message").innerText =
"Please fill all fields";


return;

}




const depositRef =
push(ref(db,"deposits"));



await set(depositRef,{

uid: currentUser.uid,

name:name,

email:currentUser.email,

senderNumber:senderNumber,

transactionId:trxId,

amount:500,

method:"Easypaisa",

status:"pending",

createdAt:Date.now()


});



document.getElementById("message").style.color="green";


document.getElementById("message").innerText =
"Deposit request submitted. Waiting for approval.";



document.getElementById("name").value="";

document.getElementById("senderNumber").value="";

document.getElementById("trxId").value="";



});



</script>


</body>
</html>
