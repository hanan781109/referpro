button:hover{

}

.login{

.login a{

<header>
    ReferPro
</header>


<div class="container">

<div class="card">

<h2>Create Account</h2>

<p class="subtitle">
Join ReferPro and start building your referral team.
</p>


<form id="registerForm">

<label>Full Name</label>

<input
    type="text"
    id="name"
    placeholder="Enter your name"
    required
>


<label>Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>


<label>Phone</label>

<input
    type="tel"
    id="phone"
    placeholder="Enter your phone number"
    required
>


<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Create password"
    minlength="6"
    required
>


<label>Referral Code</label>

<input
    type="text"
    id="referral"
    placeholder="Enter referral code (optional)"
>


<button type="submit" id="registerButton">
    Create Account
</button>

</form>


<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>


<div class="footer">
    © 2026 ReferPro. All rights reserved.
</div>

</div>
