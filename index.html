<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro - Register</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#666;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#16a34a;
}

.login{
    text-align:center;
    margin-top:20px;
}

.login a{
    color:#2563eb;
    font-weight:bold;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

</style>

</head>


<body>


<header>
ReferPro
</header>


<div class="container">

<div class="card">


<h2>Create Account</h2>


<p class="subtitle">
Join ReferPro and build your referral team.
</p>



<form id="registerForm">


<label>
Full Name
</label>

<input
type="text"
id="name"
required
>



<label>
Email
</label>

<input
type="email"
id="email"
required
>



<label>
Phone
</label>

<input
type="tel"
id="phone"
required
>



<label>
Password
</label>

<input
type="password"
id="password"
minlength="6"
required
>



<label>
Referral Code (Optional)
</label>

<input
type="text"
id="referral"
>



<button type="submit" id="btn">
Create Account
</button>


<div id="message"></div>


</form>



<div class="login">

Already have account?

<a href="login.html">
Login
</a>

</div>


</div>

</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,

createUserWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,

ref,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {


apiKey:
"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",


authDomain:
"referpro-65d27.firebaseapp.com",


databaseURL:
"https://referpro-65d27-default-rtdb.firebaseio.com",


projectId:
"referpro-65d27",


storageBucket:
"referpro-65d27.firebasestorage.app",


messagingSenderId:
"257409426857",


appId:
"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getDatabase(app);



const form =
document.getElementById("registerForm");


const btn =
document.getElementById("btn");


const message =
document.getElementById("message");



form.addEventListener("submit", async(e)=>{


e.preventDefault();



const name =
document.getElementById("name").value.trim();


const email =
document.getElementById("email").value.trim();


const phone =
document.getElementById("phone").value.trim();


const password =
document.getElementById("password").value;


const referral =
document.getElementById("referral").value.trim();



btn.disabled=true;

btn.innerText="Creating...";



try{


const userCredential =

await createUserWithEmailAndPassword(

auth,

email,

password

);



const uid =
userCredential.user.uid;



const myCode =

"REF" +

uid.substring(0,6).toUpperCase();





await set(

ref(db,"users/"+uid),

{


uid:uid,

name:name,

email:email,

phone:phone,

referralCode:myCode,

joinedWith: referral || "Direct",

wallet:0,

status:"Active",

createdAt:Date.now()


}

);




message.style.color="green";

message.innerText=
"Account created successfully!";



setTimeout(()=>{

window.location.href="login.html";

},1500);



}


catch(error){


console.log(error);


message.style.color="red";

message.innerText=
error.message;


btn.disabled=false;

btn.innerText="Create Account";


}



});


</script>


</body>
</html>
