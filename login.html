<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Admin Panel</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
    margin-bottom:20px;
}

h2{
    color:#2563eb;
    margin-top:0;
}

.stats{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.stat{
    flex:1;
    min-width:180px;
    background:#f8fafc;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.stat h3{
    margin:0;
    color:#64748b;
}

.stat p{
    font-size:30px;
    font-weight:bold;
    color:#2563eb;
    margin:10px 0 0;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f8fafc;
}

.logout{
    background:#dc2626;
    margin-top:15px;
}

.logout:hover{
    background:#b91c1c;
}

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}

.error{
    color:#dc2626;
}

</style>

</head>

<body>

<header>
ReferPro Admin Panel
</header>


<div class="container">


<div class="card">

<h2>Admin Dashboard</h2>

<div class="stats">

<div class="stat">
<h3>Total Users</h3>
<p id="totalUsers">0</p>
</div>

<div class="stat">
<h3>Total Admins</h3>
<p id="totalAdmins">0</p>
</div>

</div>

<button class="logout" id="logoutButton">
Logout
</button>

</div>



<div class="card">

<h2>Registered Users</h2>

<div id="usersArea" class="loading">
Loading users...
</div>

</div>


</div>



<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

    authDomain:
    "referpro-65d27.firebaseapp.com",

    databaseURL:
    "https://referpro-65d27-default-rtdb.firebaseio.com",

    projectId:
    "referpro-65d27",

    storageBucket:
    "referpro-65d27.firebasestorage.app",

    messagingSenderId:
    "257409426857",

    appId:
    "1:257409426857:web:8cfcdf79eab219d6f890b8"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);



/*
ADMIN UID
*/

const ADMIN_UID =
"WK9SL4msIHWZR4zelvWM9Wko2fl2";



/*
CHECK LOGIN
*/

onAuthStateChanged(auth, async (user) => {

    if(!user){

        window.location.href =
        "login.html";

        return;

    }


    if(user.uid !== ADMIN_UID){

        alert("Access denied. Admin only.");

        await signOut(auth);

        window.location.href =
        "login.html";

        return;

    }


    loadUsers();

});



/*
LOAD USERS
*/

async function loadUsers(){

    try{

        const snapshot =
        await get(ref(db,"users"));

        const usersArea =
        document.getElementById("usersArea");


        if(!snapshot.exists()){

            usersArea.innerHTML =
            "No users found.";

            return;

        }


        const users =
        snapshot.val();


        let html = `

        <table>

        <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Referral Code</th>
        <th>Joined With</th>
        </tr>

        `;


        let count = 0;


        for(const uid in users){

            const user =
            users[uid];

            count++;


            html += `

            <tr>

            <td>
            ${user.name || "-"}
            </td>

            <td>
            ${user.email || "-"}
            </td>

            <td>
            ${user.phone || "-"}
            </td>

            <td>
            ${user.referralCode || "-"}
            </td>

            <td>
            ${user.joinedWith || "-"}
            </td>

            </tr>

            `;

        }


        html += "</table>";


        usersArea.innerHTML =
        html;


        document.getElementById("totalUsers")
        .innerText = count;


        document.getElementById("totalAdmins")
        .innerText = "1";


    }
    catch(error){

        console.error(error);

        document.getElementById("usersArea")
        .innerHTML =
        '<p class="error">Unable to load users: ' +
        error.message +
        '</p>';

    }

}



/*
LOGOUT
*/

document
.getElementById("logoutButton")
.addEventListener("click", async () => {

    await signOut(auth);

    window.location.href =
    "login.html";

});

</script>


</body>
</html>
