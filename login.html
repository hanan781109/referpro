<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f6fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
width:350px;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px #0002;
}

h2{
text-align:center;
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin-top:12px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:13px;
margin-top:20px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

#error{
color:red;
text-align:center;
margin-top:15px;
}

a{
display:block;
text-align:center;
margin-top:15px;
}

</style>

</head>


<body>


<div class="card">


<h2>
ReferPro Login
</h2>


<input 
type="email"
id="email"
placeholder="Email">


<input
type="password"
id="password"
placeholder="Password">


<button id="login">
Login
</button>


<div id="error"></div>


<a href="register.html">
Create Account
</a>


</div>




<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";




const firebaseConfig={


apiKey:"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

authDomain:"referpro-65d27.firebaseapp.com",

databaseURL:"https://referpro-65d27-default-rtdb.firebaseio.com",

projectId:"referpro-65d27",

storageBucket:"referpro-65d27.firebasestorage.app",

messagingSenderId:"257409426857",

appId:"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);





const ADMIN_EMAIL="hananjanweribro@gmail.com";





login.onclick=async()=>{


let email=
document.getElementById("email").value.trim();


let password=
document.getElementById("password").value;



try{


let result=
await signInWithEmailAndPassword(
auth,
email,
password
);



let user=result.user;




if(user.email===ADMIN_EMAIL){


window.location.href="admin.html";


}

else{


window.location.href="dashboard.html";


}



}


catch(e){


document.getElementById("error").innerText=
e.message;


}



};


</script>


</body>
</html>
