<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro - Admin Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
}

.card{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 5px 20px #0002;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#111827;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

h2{
    text-align:center;
    color:#2563eb;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

.error{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#fee2e2;
    color:#b91c1c;
    border-radius:8px;
    font-size:14px;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:20px;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
ReferPro
</div>

<p class="subtitle">
Admin Panel Login
</p>

<h2>Login</h2>


<form id="loginForm">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter admin email"
    required
>


<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Enter password"
    required
>


<button type="submit" id="loginButton">
Login
</button>

<div id="errorMessage" class="error"></div>

</form>


<div class="footer">
© 2026 ReferPro. All rights reserved.
</div>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

    authDomain:
    "referpro-65d27.firebaseapp.com",

    databaseURL:
    "https://referpro-65d27-default-rtdb.firebaseio.com",

    projectId:
    "referpro-65d27",

    storageBucket:
    "referpro-65d27.firebasestorage.app",

    messagingSenderId:
    "257409426857",

    appId:
    "1:257409426857:web:8cfcdf79eab219d6f890b8"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/*
ADMIN UID
*/

const ADMIN_UID =
"WK9SL4msIHWZR4zelvWM9Wko2fl2";


const form =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const errorMessage =
document.getElementById("errorMessage");


/*
SHOW ERROR
*/

function showError(message){

    errorMessage.innerText = message;

    errorMessage.style.display = "block";

}


/*
CHECK EXISTING LOGIN
*/

onAuthStateChanged(auth, async (user) => {

    if(!user){
        return;
    }


    if(user.uid === ADMIN_UID){

        window.location.replace("admin.html");

        return;

    }


    /*
    Logged-in user is NOT admin
    */

    await signOut(auth);

});


/*
LOGIN
*/

form.addEventListener("submit", async function(e){

    e.preventDefault();


    errorMessage.style.display = "none";


    const email =
    document.getElementById("email")
    .value
    .trim();


    const password =
    document.getElementById("password")
    .value;


    loginButton.disabled = true;

    loginButton.innerText =
    "Logging in...";


    try{

        const userCredential =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        userCredential.user;


        /*
        CHECK ADMIN UID
        */

        if(user.uid !== ADMIN_UID){

            await signOut(auth);

            showError(
                "Access denied. This account is not an admin account."
            );

            loginButton.disabled = false;

            loginButton.innerText =
            "Login";

            return;

        }


        /*
        ADMIN LOGIN SUCCESS
        */

        window.location.replace("admin.html");


    }
    catch(error){

        console.error(error);


        let message =
        "Login failed. Please check your email and password.";


        if(error.code === "auth/invalid-credential"){

            message =
            "Incorrect email or password.";

        }

        else if(error.code === "auth/user-not-found"){

            message =
            "No account found with this email.";

        }

        else if(error.code === "auth/wrong-password"){

            message =
            "Incorrect password.";

        }

        else if(error.code === "auth/invalid-email"){

            message =
            "Please enter a valid email.";

        }

        else if(error.code === "auth/too-many-requests"){

            message =
            "Too many attempts. Please try again later.";

        }


        showError(message);


        loginButton.disabled = false;

        loginButton.innerText =
        "Login";

    }

});

</script>

</body>
</html>
