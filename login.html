<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Login</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:420px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

a{
    color:#2563eb;
    text-decoration:none;
}

.footer{
    text-align:center;
    margin-top:20px;
}

</style>

</head>


<body>


<header>
ReferPro Login
</header>



<div class="container">


<h2>Welcome Back</h2>


<form>


<label>Email</label>

<input type="email" placeholder="Enter your email" required>



<label>Password</label>

<input type="password" placeholder="Enter password" required>



<button type="submit">
Login
</button>


</form>



<div class="footer">

<p>
Forgot password?
<a href="#">
Reset
</a>
</p>


<p>
New user?
<a href="register.html">
Create Account
</a>
</p>


<p>
<a href="dashboard.html">
Go To Dashboard
</a>
</p>


</div>


</div>



</body>
</html>
