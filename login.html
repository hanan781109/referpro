<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Login</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:420px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

label{
    display:block;
    margin-top:15px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

a{
    color:#2563eb;
    text-decoration:none;
}

.footer{
    text-align:center;
    margin-top:20px;
}

</style>

</head>

<body>

<header>
ReferPro Login
</header>


<div class="container">

<h2>Welcome Back</h2>


<form id="loginForm">

<label>Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>


<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter password"
    required
>


<button type="submit" id="loginButton">
Login
</button>

</form>


<div class="footer">

<p>
New user?
<a href="register.html">
Create Account
</a>
</p>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

    authDomain:
    "referpro-65d27.firebaseapp.com",

    databaseURL:
    "https://referpro-65d27-default-rtdb.firebaseio.com",

    projectId:
    "referpro-65d27",

    storageBucket:
    "referpro-65d27.firebasestorage.app",

    messagingSenderId:
    "257409426857",

    appId:
    "1:257409426857:web:8cfcdf79eab219d6f890b8"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");


form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;


    button.disabled = true;

    button.innerText = "Logging in...";


    try {

        const userCredential =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const uid =
        userCredential.user.uid;


        /*
        Check whether this UID is an admin
        */

        const adminSnapshot =
        await get(
            ref(db, "admins/" + uid)
        );


        if(adminSnapshot.exists() &&
           adminSnapshot.val() === true){

            window.location.href =
            "admin.html";

        }else{

            window.location.href =
            "dashboard.html";

        }


    }
    catch(error){

        console.error(error);

        alert(
            "Login failed:\n\n" +
            error.message
        );


        button.disabled = false;

        button.innerText = "Login";

    }

});

</script>

</body>
</html>
