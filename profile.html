<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Profile</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px #0002;
}

.avatar{
    width:90px;
    height:90px;
    background:#2563eb;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin:auto;
}

h2{
    text-align:center;
    color:#2563eb;
}

.info{
    margin-top:20px;
}

.row{
    padding:12px;
    border-bottom:1px solid #ddd;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.logout{
    background:#dc2626;
}

a{
    text-decoration:none;
    color:#2563eb;
}

.footer{
    text-align:center;
    margin-top:20px;
}

</style>

</head>

<body>


<header>
ReferPro Profile
</header>


<div class="container">


<div class="card">


<div class="avatar">
U
</div>


<h2>User Profile</h2>


<div class="info">


<div class="row">
<b>Name:</b> User
</div>


<div class="row">
<b>Email:</b> user@email.com
</div>


<div class="row">
<b>Phone:</b> 03XXXXXXXXX
</div>


<div class="row">
<b>Account Status:</b> Active
</div>


<div class="row">
<b>Member Since:</b> 2026
</div>


</div>



<button>
Edit Profile
</button>


<button class="logout">
Logout
</button>



<div class="footer">

<p>
<a href="dashboard.html">
Back To Dashboard
</a>
</p>

</div>


</div>


</div>


</body>
</html>
