<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getAuth,
createUserWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getDatabase,
ref,
set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",
  authDomain: "referpro-65d27.firebaseapp.com",
  projectId: "referpro-65d27",
  storageBucket: "referpro-65d27.firebasestorage.app",
  messagingSenderId: "257409426857",
  appId: "1:257409426857:web:8cfcdf79eab219d6f890b8",
  measurementId: "G-GFC4WMB2HN"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);



document.querySelector("form").addEventListener("submit",(e)=>{

e.preventDefault();


let inputs=document.querySelectorAll("input");


let name = inputs[0].value;

let email = inputs[1].value;

let phone = inputs[2].value;

let password = inputs[3].value;

let referral = inputs[4].value;



createUserWithEmailAndPassword(auth,email,password)

.then((userCredential)=>{


let uid = userCredential.user.uid;


let myCode = "REF" + uid.substring(0,6).toUpperCase();



set(ref(db,"users/"+uid),{


name:name,

email:email,

phone:phone,

referralCode:myCode,

joinedWith:referral,

createdAt:new Date().toString()


});


alert("Account Created Successfully!");

window.location="login.html";


})


.catch((error)=>{

alert(error.message);

});


});


</script>
