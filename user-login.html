<!DOCTYPE html>
<html>

<head>

<title>ReferPro User Login</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:Arial;
background:#f3f6fb;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}

.card{
background:white;
width:350px;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px #0002;
}

h2{
text-align:center;
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:13px;
margin-top:20px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

#error{
color:red;
text-align:center;
margin-top:15px;
}

a{
display:block;
text-align:center;
margin-top:15px;
}

</style>

</head>


<body>


<div class="card">


<h2>
ReferPro Login
</h2>


<input 
type="email"
id="email"
placeholder="Enter Email">


<input
type="password"
id="password"
placeholder="Enter Password">



<button id="loginBtn">
Login
</button>


<div id="error"></div>



<a href="register.html">
Create New Account
</a>


</div>





<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";





const firebaseConfig={


apiKey:"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

authDomain:"referpro-65d27.firebaseapp.com",

databaseURL:"https://referpro-65d27-default-rtdb.firebaseio.com",

projectId:"referpro-65d27",

storageBucket:"referpro-65d27.firebasestorage.app",

messagingSenderId:"257409426857",

appId:"1:257409426857:web:8cfcdf79eab219d6f890b8"

};




const app=initializeApp(firebaseConfig);

const auth=getAuth(app);




const ADMIN_EMAIL="hananjanweribro@gmail.com";




loginBtn.onclick=async()=>{


let email=
document.getElementById("email").value.trim();


let password=
document.getElementById("password").value;



try{


let result=

await signInWithEmailAndPassword(

auth,
email,
password

);



let user=result.user;



if(user.email===ADMIN_EMAIL){


alert("Admin account. Use admin login.");

location="login.html";


return;


}



location="dashboard.html";



}


catch(error){


document.getElementById("error").innerText=
error.message;


}



};



</script>


</body>

</html>
