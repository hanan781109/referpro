<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro User Login</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

.container{
    max-width:400px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

input{
    width:100%;
    padding:13px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#16a34a;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

a{
    color:#2563eb;
}

</style>

</head>


<body>

<header>
ReferPro
</header>


<div class="container">

<h2>User Login</h2>


<input 
type="email"
id="email"
placeholder="Enter email">


<input 
type="password"
id="password"
placeholder="Enter password">



<button id="loginBtn">
Login
</button>


<div id="message"></div>


<p style="text-align:center">
New user?
<a href="register.html">
Create Account
</a>
</p>


</div>




<script type="module">


import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig={


apiKey:"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",

authDomain:"referpro-65d27.firebaseapp.com",

databaseURL:"https://referpro-65d27-default-rtdb.firebaseio.com",

projectId:"referpro-65d27",

storageBucket:"referpro-65d27.firebasestorage.app",

messagingSenderId:"257409426857",

appId:"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);



document
.getElementById("loginBtn")
.addEventListener("click",async()=>{


const email=
document.getElementById("email").value.trim();


const password=
document.getElementById("password").value;



try{


await signInWithEmailAndPassword(
auth,
email,
password
);



document.getElementById("message").style.color="green";

document.getElementById("message").innerText=
"Login Successful";


setTimeout(()=>{

window.location="dashboard.html";

},1000);



}
catch(error){


document.getElementById("message").style.color="red";

document.getElementById("message").innerText=
error.message;


}


});


</script>


</body>
</html>
