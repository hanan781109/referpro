<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Withdrawal</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

.info{
    background:#eaffea;
    border-left:5px solid #16a34a;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:13px;
    background:#dc2626;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#16a34a;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>


<body>


<header>
ReferPro Withdrawal
</header>


<div class="container">


<h2>Withdraw Request</h2>


<div class="info">

<p>
Available Balance:
<b>Check Wallet</b>
</p>

<p>
Minimum Withdrawal:
<b>Rs. 200</b>
</p>

<p>
Maximum Withdrawal:
<b>Rs. 7000</b>
</p>

</div>




<label>Payment Method</label>

<select id="method">

<option>Easypaisa</option>

<option>JazzCash</option>

</select>




<label>Account Holder Name</label>

<input 
id="name"
type="text"
placeholder="Enter name">





<label>Account Number</label>

<input 
id="accountNumber"
type="number"
placeholder="03XXXXXXXXX">





<label>Withdrawal Amount</label>

<input 
id="amount"
type="number"
placeholder="Enter amount">





<button id="withdrawBtn">

Submit Withdrawal Request

</button>


<div id="message"></div>



</div>




<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,

onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,

ref,

push,

set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {


apiKey:
"AIzaSyB2MHb9flfcWipUxDM6hF3Hgvy9ZsBHV0g",


authDomain:
"referpro-65d27.firebaseapp.com",


databaseURL:
"https://referpro-65d27-default-rtdb.firebaseio.com",


projectId:
"referpro-65d27",


storageBucket:
"referpro-65d27.firebasestorage.app",


messagingSenderId:
"257409426857",


appId:
"1:257409426857:web:8cfcdf79eab219d6f890b8"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);



let currentUser = null;



onAuthStateChanged(auth,(user)=>{


if(!user){

window.location="login.html";

return;

}


currentUser=user;


});







document
.getElementById("withdrawBtn")
.addEventListener("click",async()=>{


if(!currentUser){

alert("Please login first");

return;

}



const method =
document.getElementById("method").value;



const name =
document.getElementById("name").value.trim();



const accountNumber =
document.getElementById("accountNumber").value.trim();



const amount =
Number(document.getElementById("amount").value);




if(!name || !accountNumber || !amount){


document.getElementById("message").innerText =
"Please fill all fields";


return;

}




if(amount < 200 || amount > 7000){


document.getElementById("message").innerText =
"Withdrawal limit is Rs.200 - Rs.7000";


return;


}





const withdrawRef =
push(ref(db,"withdrawals"));





await set(withdrawRef,{


uid: currentUser.uid,


email: currentUser.email,


method: method,


name:name,


accountNumber:accountNumber,


amount:amount,


status:"pending",


createdAt:Date.now()


});





document.getElementById("message").style.color="green";


document.getElementById("message").innerText =
"Withdrawal request submitted. Waiting for approval.";



});



</script>


</body>
</html>
