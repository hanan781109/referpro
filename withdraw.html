<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReferPro Withdrawal</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}

h2{
    text-align:center;
    color:#2563eb;
}

.info{
    background:#eaffea;
    border-left:5px solid #16a34a;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:13px;
    background:#dc2626;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#16a34a;
}

a{
    color:#2563eb;
    text-decoration:none;
}

.footer{
    text-align:center;
    margin-top:20px;
}

</style>

</head>


<body>


<header>
ReferPro Withdrawal
</header>


<div class="container">


<h2>Withdraw Request</h2>


<div class="info">

<p>
Available Balance:
<b>Rs. 0</b>
</p>

<p>
Minimum Withdrawal:
<b>Rs. 200</b>
</p>

<p>
Maximum Withdrawal:
<b>Rs. 7000</b>
</p>

</div>



<label>Select Payment Method</label>

<select>

<option>Easypaisa</option>

<option>JazzCash</option>

</select>



<label>Account Holder Name</label>

<input type="text" placeholder="Enter name">



<label>Account Number</label>

<input type="number" placeholder="03XXXXXXXXX">



<label>Withdrawal Amount</label>

<input type="number" placeholder="Enter amount">



<button>
Submit Withdrawal Request
</button>



<div class="footer">

<p>
<a href="dashboard.html">
Back To Dashboard
</a>
</p>

</div>



</div>


</body>
</html>
